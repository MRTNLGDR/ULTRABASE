name: Ultrabase real full-stack

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'RUN.bat'
      - '.gitignore'
      - 'docker/**'
      - 'ultrabase/**'
      - '.github/workflows/ultrabase-full-stack.yml'
      - 'AGENTS.md'
      - 'ULTRABASE*.md'
      - 'ULTRABASE-STATUS.json'
      - 'README.md'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'RUN.bat'
      - '.gitignore'
      - 'docker/**'
      - 'ultrabase/**'
      - '.github/workflows/ultrabase-full-stack.yml'

permissions:
  contents: read

concurrency:
  group: ultrabase-real-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-contained-windows:
    name: Windows bootstrap and cryptography
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse PowerShell and validate Node programs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            'ultrabase/runtime/Ultrabase-Bootstrap.ps1',
            'ultrabase/runtime/tests/Test-Ultrabase-SelfContained.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
          }
          node --check ultrabase/runtime/generate-ultrabase-env.mjs
          node --check ultrabase/runtime/verify-ultrabase-live.mjs
          node --check ultrabase/runtime/redact-runtime-log.mjs
      - name: Prove the one-click and secret-safety contract
        shell: powershell
        run: ./ultrabase/runtime/tests/Test-Ultrabase-SelfContained.ps1

  real-full-stack:
    name: Real Docker stack, isolation and restore
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          docker system prune --all --force || true
          df -h
      - name: Generate a clean cryptographic installation
        run: |
          set -euo pipefail
          node ultrabase/runtime/generate-ultrabase-env.mjs \
            --env docker/.env \
            --template docker/.env.example \
            --json
          node ultrabase/runtime/generate-ultrabase-env.mjs \
            --env docker/.env \
            --template docker/.env.example \
            --check \
            --json
          test "$(stat -c '%a' docker/.env)" = "600"
          git check-ignore --quiet docker/.env
          test -z "$(git ls-files docker/.env)"
          mkdir -p ultrabase/runtime/evidence docker/backups docker/volumes/storage
      - name: Resolve and pull the actual self-hosted images
        working-directory: docker
        run: |
          set -euo pipefail
          docker compose version
          docker compose config --quiet
          docker compose pull --ignore-buildable
      - name: Build the branded Studio and start every real service
        working-directory: docker
        run: |
          set -euo pipefail
          docker compose build --pull studio
          docker compose up -d --wait --wait-timeout 900
          docker compose ps --all
      - name: Run no-mock acceptance and restore verification
        run: node ultrabase/runtime/verify-ultrabase-live.mjs
      - name: Capture redacted evidence
        if: always()
        run: |
          mkdir -p ultrabase/runtime/evidence
          (cd docker && docker compose ps --all) > ultrabase/runtime/evidence/compose-ps.txt 2>&1 || true
          (cd docker && docker compose logs --no-color --tail=500) > ultrabase/runtime/evidence/compose-raw.log 2>&1 || true
          if [ -f docker/.env ] && [ -f ultrabase/runtime/evidence/compose-raw.log ]; then
            node ultrabase/runtime/redact-runtime-log.mjs \
              docker/.env \
              ultrabase/runtime/evidence/compose-raw.log \
              ultrabase/runtime/evidence/compose-redacted.log || true
          fi
          rm -f ultrabase/runtime/evidence/compose-raw.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultrabase-real-full-stack-${{ github.run_id }}
          path: |
            ultrabase/runtime/evidence/live-verification.json
            ultrabase/runtime/evidence/compose-ps.txt
            ultrabase/runtime/evidence/compose-redacted.log
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy only the ephemeral CI installation
        if: always()
        working-directory: docker
        run: docker compose down --volumes --remove-orphans || true
